[project]
name = "vis-mcp"
version = "0.1.0"
description = "Experimental MCP server for structured, bias-resistant decision deliberation"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "instructor>=1.0",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
